<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Cobalt Blue Gradient matching FinTech theme -->
    <linearGradient id="karmadiCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5BFD" />
      <stop offset="60%" stop-color="#2B4CE0" />
      <stop offset="100%" stop-color="#1B3BB8" />
    </linearGradient>

    <!-- Electric Lime Glow Gradient -->
    <linearGradient id="limeAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3F742" />
      <stop offset="100%" stop-color="#C2FF59" />
    </linearGradient>
  </defs>

  <!-- Modern Rounded Emblem in Cobalt Blue filling the square -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#karmadiCobalt)" />

  <!-- Dynamic Career Arrow in Electric Lime (Top Diagonal) -->
  <path d="M26 32 L41 17" stroke="url(#limeAccent)" stroke-width="5" stroke-linecap="round" />
  <path d="M33 17 H41 V25" stroke="url(#limeAccent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stable Vertical Pillar in Crisp Pure White -->
  <path d="M22 17 V47" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />

  <!-- Lower Leg in Crisp Pure White -->
  <path d="M30 31 L43 47" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />

  <!-- Electric Lime Innovation Dot -->
  <circle cx="48" cy="15" r="3.2" fill="#A3F742" />
</svg>
